name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run the standard-library test suite
        run: python -B -m unittest discover -s tests -v

  redis:
    name: Real Redis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Redis
        timeout-minutes: 10
        # A stalled package mirror once hung apt-get update until the job timed out, so bound each attempt.
        run: |
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            if timeout 150 $apt update && timeout 150 $apt install -y redis-server; then
              break
            fi
            echo "apt-get attempt $attempt failed; retrying" >&2
            sleep 10
          done
          redis-server --version
      - name: Load exports into Redis and import Redis dumps
        run: python -B -m unittest discover -s tests -p "test_redis*.py" -v

  python-products:
    name: Real Spark and LiteLLM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PySpark and the LiteLLM proxy
        run: python -m pip install "pyspark==4.1.1" "litellm[proxy]==1.110.2"
      - name: Run the exported Spark jobs and LiteLLM configuration
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          python -B -m unittest discover -s tests -p "test_spark*.py" -v
          python -B -m unittest discover -s tests -p "test_litellm*.py" -v

  airflow:
    name: Real Airflow
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Airflow
        run: >-
          python -m pip install "apache-airflow==3.4.0"
          --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.4.0/constraints-3.12.txt
      - name: Test an exported DAG with Airflow
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/dag.json" <<'EOF'
          {
            "dag_id": "jjap_ci",
            "tasks": [
              {"task_id": "extract", "command": ["python3", "-c", "print('extract {{ not jinja }}')"]},
              {"task_id": "load", "command": ["sh", "-c", "echo \"$1\"", "sh", "a b $HOME"], "upstream": ["extract"],
               "retries": 1, "retry_delay_seconds": 1}
            ]
          }
          EOF
          python -B airflow_server.py export --dag-file "$RUNNER_TEMP/dag.json" --out "$RUNNER_TEMP/dags"
          export AIRFLOW__CORE__DAGS_FOLDER="$RUNNER_TEMP/dags"
          airflow db migrate
          airflow dags list-import-errors | tee "$RUNNER_TEMP/errors.txt"
          if grep -q jjap_ci "$RUNNER_TEMP/errors.txt"; then exit 1; fi
          airflow dags test jjap_ci 2>&1 | tee "$RUNNER_TEMP/test.log"
          grep -q "extract {{ not jinja }}" "$RUNNER_TEMP/test.log"
          grep -q 'a b \$HOME' "$RUNNER_TEMP/test.log"

  docker-products:
    name: Real ${{ matrix.product }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        product: [mongo, neo4j, kafka, opensearch, iceberg, nexus]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Move data between jjap and the real product
        run: python -B .github/scripts/real_products.py ${{ matrix.product }}
